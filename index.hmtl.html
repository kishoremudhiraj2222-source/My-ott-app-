<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My OTT Prototype</title>
  <link rel="stylesheet" href="style.css">
</<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e50914">

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="logo">STREAM<span>FLIX</span></div>
    <div class="profile-icon">👤</div>
  </header>

  <!-- Video Player Section (Modal/Embedded) -->
  <section class="player-container" id="playerContainer" style="display: none;">
    <video id="videoPlayer" controls playsinline></video>
    <div class="player-details">
      <h2 id="nowPlayingTitle">Title</h2>
      <p id="nowPlayingDesc">Description</p>
      <button class="close-btn" onclick="closePlayer()">✕ Close Player</button>
    </div>
  </section>

  <!-- Featured Banner -->
  <div class="hero-banner" id="heroBanner">
    <div class="banner-content">
      <h1 id="heroTitle">Featured Movie</h1>
      <p id="heroDesc">Watch thrilling original stories on your phone.</p>
      <button class="play-btn" onclick="playCurrentHero()">▶ Play Now</button>
    </div>
  </div>

  <!-- Rows / Categories -->
  <main class="content-rows">
    <h3>Trending Now</h3>
    <div class="carousel" id="trendingList"></div>

    <h3>Web Series & Originals</h3>
    <div class="carousel" id="seriesList"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
